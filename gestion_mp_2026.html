/* ===== Escáner de código de barras / QR ===== */
async function abrirEscaner() {
  const root = el('div');
  root.innerHTML = '<div class="modal-header"><h3 class="modal-title">Escanear código</h3><button class="btn btn-icon btn-ghost" data-close>' + icon('x') + '</button></div>';
  const body = el('div', { class: 'modal-body' });
  const video = el('video', { autoplay: '', playsinline: '', style: 'width:100%;max-height:60vh;border-radius:var(--rd-md);background:black' });
  body.appendChild(video);
  body.appendChild(el('div', { class: 'tiny muted mt-2', text: 'Apunta la cámara al código de barras / QR del N° de inventario.' }));
  root.appendChild(body);
  root.appendChild(el('div', { class: 'modal-footer' }, [el('button', { class: 'btn btn-ghost', text: 'Cancelar', dataset: { close: '1' } })]));
  const m = openModal(root);
  let stream;
  let running = true;
  const finalizar = () => { running = false; if (stream) stream.getTracks().forEach((t) => t.stop()); };
  m.backdrop.addEventListener('click', (e) => { if (e.target === m.backdrop) finalizar(); });
  m.modal.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', finalizar));
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    let detector = null;
    if ('BarcodeDetector' in window) {
      try { detector = new BarcodeDetector({ formats: ['code_128','code_39','ean_13','qr_code'] }); } catch (e) { detector = null; }
    }
    if (!detector) {
      // fallback ZXing
      const zxing = await loadZXing();
      if (zxing) {
        const reader = new zxing.BrowserMultiFormatReader();
        reader.decodeFromVideoElement(video, (result) => { if (result && running) { found(result.getText()); } });
        m.backdrop.addEventListener('click', () => { try { reader.reset(); } catch (e) {} });
      } else {
        Toast.danger('Escáner no soportado en este navegador.'); finalizar(); m.close(); return;
      }
    } else {
      (async function loop() {
        while (running) {
          try { const codes = await detector.detect(video); if (codes && codes[0]) { found(codes[0].rawValue); break; } } catch (e) {}
          await new Promise((r) => setTimeout(r, 300));
        }
      })();
    }
  } catch (e) {
    Toast.danger('No se pudo acceder a la cámara: ' + e.message);
    finalizar(); m.close();
  }
  function found(value) {
    finalizar();
    const v = String(value).trim();
    Toast.success('Detectado: ' + v);
    m.close();
    // buscar equipo
    const eq = (MP.equipos.data || []).find((e) => e.inventario === v || e.serie === v);
    if (eq) abrirFichaEquipo(eq.key);
    else { $('#globalSearch').value = v; $('#globalSearch').dispatchEvent(new Event('input')); navigate('buscar'); }
  }
}
async function loadZXing() {
  if (window.ZXingBrowser) return window.ZXingBrowser;
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js';
    s.onload = () => resolve(window.ZXingBrowser || null);
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}

/* ===== Cargar maestro Excel (.xlsm/.xlsx) ===== */
async function cargarMaestroDesdeArchivo(file) {
  if (!file) return;
  Toast.show('Leyendo archivo… (' + Math.round(file.size / 1024) + ' KB)');
  const X = await loadXLSX();
  if (!X) return;
  let wb;
  try {
    const buf = await file.arrayBuffer();
    wb = X.read(buf, { type: 'array', cellDates: false, cellNF: false });
  } catch (e) { Toast.danger('No se pudo leer el archivo: ' + e.message); return; }
  // Buscar hojas case-insensitive con variantes comunes
  const names = wb.SheetNames || [];
  function findSheet(target) {
    const t = target.toLowerCase().replace(/[^a-z0-9]/g, '');
    return names.find((n) => n.toLowerCase().replace(/[^a-z0-9]/g, '') === t);
  }
  const pmpName = findSheet('PMP_2026') || findSheet('PMP2026') || findSheet('PMP');
  const regName = findSheet('Registro_MP-2026') || findSheet('RegistroMP2026') || findSheet('Registro');
  if (!pmpName && !regName) {
    Toast.danger('No encontré las hojas PMP_2026 ni Registro_MP-2026. Hojas en el archivo: ' + names.join(', '));
    return;
  }
  function sheetTo2D(name) {
    if (!name) return [];
    const ws = wb.Sheets[name];
    const arr = X.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: true });
    // Quitar filas completamente vacías al final
    while (arr.length && arr[arr.length - 1].every((c) => c === '' || c == null)) arr.pop();
    return arr;
  }
  const pmpRows = sheetTo2D(pmpName);
  const regRows = sheetTo2D(regName);

  // Preview en modal
  const root = el('div');
  root.innerHTML = '<div class="modal-header"><h3 class="modal-title">Confirmar carga del maestro</h3><button class="btn btn-icon btn-ghost" data-close>' + icon('x') + '</button></div>';
  const body = el('div', { class: 'modal-body' });
  body.appendChild(el('div', { class: 'card mb-3' }, [
    el('h3', { text: 'Resumen del archivo' }),
    el('div', { class: 'tiny' }, [el('strong', { text: file.name })]),
    el('div', { class: 'tiny muted', text: 'Tamaño: ' + Math.round(file.size / 1024) + ' KB' }),
    el('div', { class: 'mt-2' }, [
      el('div', { html: '<strong>PMP_2026</strong>: ' + (pmpName ? pmpRows.length + ' filas (incluye encabezados)' : '<span class="badge badge-danger">no encontrada</span>') }),
      el('div', { html: '<strong>Registro_MP-2026</strong>: ' + (regName ? regRows.length + ' filas (incluye encabezados)' : '<span class="badge badge-warning">no encontrada (opcional)</span>') })
    ])
  ]));
  body.appendChild(el('div', { class: 'card', style: 'background:#fef3c7;border-color:#fbbf24' }, [
    el('div', { class: 'tiny' }, [el('strong', { html: icon('alert',12) + ' Atención: ' }), 'Esto <u>reemplaza completamente</u> el contenido actual de PMP_2026 y Registro_MP-2026 en el Google Sheet. Las hojas auxiliares (eventos, pendientes, asignaciones, etc.) no se tocan.'])
  ]));
  // Mostrar primeras filas como preview
  if (pmpRows.length) {
    body.appendChild(el('h3', { class: 'mt-3', text: 'Vista previa PMP_2026 (filas 7–10)' }));
    const tw = el('div', { class: 'table-wrap', style: 'max-height:200px;overflow:auto' });
    const t = el('table', { class: 'table table-dense' });
    const start = Math.max(6, 0); // fila 7 (index 6) = encabezados
    const end = Math.min(start + 4, pmpRows.length);
    let h = '<tbody>';
    for (let i = start; i < end; i++) {
      h += '<tr>' + (pmpRows[i] || []).slice(0, 12).map((c) => '<td>' + escapeHtml(String(c).slice(0, 30)) + '</td>').join('') + '</tr>';
    }
    h += '</tbody>';
    t.innerHTML = h; tw.appendChild(t); body.appendChild(tw);
  }
  root.appendChild(body);
  const ft = el('div', { class: 'modal-footer' });
  ft.appendChild(el('button', { class: 'btn btn-ghost', text: 'Cancelar', dataset: { close: '1' } }));
  ft.appendChild(el('button', { class: 'btn btn-primary', html: icon('upload',14) + ' Cargar al Google Sheet', onclick: async () => {
    document.querySelectorAll('.modal-backdrop').forEach((b, i, all) => { if (i === all.length - 1) b.remove(); });
    Toast.show('Enviando al Sheet… puede tardar 15-60s para archivos grandes');
    try {
      const r = await api('cargarMaestro', { pmpRows, regRows, replace: true }, { timeout: 240000 });
      if (r.ok) {
        Toast.success('Maestro cargado: ' + r.data.pmpFilas + ' filas PMP, ' + r.data.regFilas + ' filas Registro');
        await recargarTodo({ force: true });
      } else Toast.danger('Error: ' + r.error);
    } catch (e) { Toast.danger('Error: ' + e.message); }
  } }));
  root.appendChild(ft);
  openModal(root, { size: 'lg' });
}

          'Pega el contenido de <code>Code.gs</code> (archivo junto a este HTML).',
          'Reemplaza <code>const TOKEN = \'PEGA_TU_TOKEN_AQUI\'</code> con tu API_TOKEN.',
          'Implementar → Aplicación web → Ejecutar como: Yo · Acceso: Cualquiera.',
          'Copia la URL que termina en <code>/exec</code> y pégala aquí.']
      }));
      h.appendChild(el('button', { class: 'btn btn-primary mt-3', html: icon('check-circle',14) + ' Probar conexión y entrar', onclick: async () => {
        try {
          const r = await api('health', {}, { bypassOffline: true });
          if (r.ok) {
            Toast.success('Conectado ✓');
            // Init hojas
            const ri = await api('inicializarHojas', {});
            if (ri.ok) Toast.success('Hojas auxiliares listas');
            root.remove();
            recargarTodo({ force: true });
          } else Toast.danger('Error: ' + r.error);
        } catch (e) { Toast.danger('Sin conexión: ' + e.message); }
      } }));
    }
    w.appendChild(h);
    const nav = el('div', { class: 'row-between mt-4' });
    nav.appendChild(paso > 1 ? el('button', { class: 'btn btn-ghost', text: '← Anterior', onclick: () => { paso--; pintar(); } }) : el('span'));
    nav.appendChild(paso < 3 ? el('button', { class: 'btn btn-primary', text: 'Siguiente →', onclick: () => { paso++; pintar(); } }) : el('span'));
    w.appendChild(nav);
  }
  pintar();
  root.appendChild(w);
  document.getElementById('wizardRoot').appendChild(root);
}

/* ===== Boot ===== */
function configIncompleta() {
  return !MP.config.SPREADSHEET_ID || !MP.config.WEB_APP_URL || !MP.config.API_TOKEN;
}

function bindAtajos() {
  document.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
    if (e.key === '/') { e.preventDefault(); const s = $('#globalSearch'); if (s) s.focus(); }
    if (e.key === 'Escape') { document.querySelectorAll('.modal-backdrop').forEach((b) => b.remove()); }
    if (e.key === 'g') {
      const handler = (e2) => {
        if (e2.key === 'p') navigate('pendientes');
        else if (e2.key === 'i') navigate('inicio');
        else if (e2.key === 'v') navigate('verificacion');
        else if (e2.key === 'c') navigate('config');
        else if (e2.key === 'b') navigate('buscar');
        else if (e2.key === 'm') navigate('plantilla');
        else if (e2.key === 'k') navigate('calendario');
        document.removeEventListener('keydown', handler, true);
      };
      document.addEventListener('keydown', handler, true);
      setTimeout(() => document.removeEventListener('keydown', handler, true), 1500);
    }
  });
}

function startHealthCheck() {
  setInterval(async () => {
    if (configIncompleta() || MP.modoOfflineForzado) return;
    try { const r = await api('health', {}); if (r.ok) { MP.ultimoSyncOk = Date.now(); MP.syncStatus = 'idle'; } else MP.syncStatus = 'error'; }
    catch (e) { MP.syncStatus = 'offline'; }
    updateSyncIndicator();
  }, 60000);
}

async function boot() {
  applyPrefs();
  renderShell();
  // hidratar desde cache
  if ((MP.equipos.data || []).length) calcularKPIsLocal();
  // restaurar vista
  const initial = (location.hash.replace('#','')) || MP.uiState.vista || 'inicio';
  if (configIncompleta()) {
    abrirWizard();
    navigate('config');
  } else {
    navigate(initial);
    // restaurar modal si quedaba abierto (ficha equipo)
    if (MP.uiState.modalAbierto && MP.uiState.modalAbierto.tipo === 'ficha') {
      setTimeout(() => { try { abrirFichaEquipo(MP.uiState.modalAbierto.key); } catch (e) {} }, 200);
    }
    // refetch silencioso
    recargarTodo({ force: true });
    Queue.process();
  }
  bindAtajos();
  startHealthCheck();
  // procesar cola al volver online
  window.addEventListener('online', () => Queue.process());
  // autosave scroll
  window.addEventListener('scroll', debounce(() => { MP.uiState.scrollY = window.scrollY; saveUiStateDebounced(); }, 200), true);
}

document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
