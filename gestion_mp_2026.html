<style>
/* =========================================================================
   SISTEMA DE DISEÑO MP 2026
   -------------------------------------------------------------------------
   Paleta:      Primary azul médico (#1f3a64). Acento verde (#16a34a).
                9 grises neutros. Semánticos: success/warning/danger/info.
                Dark mode redefine cada token.
   Tipografía:  system-ui (fallback Inter), tamaños xs..3xl, pesos 400/500/600.
   Espaciado:   escala 4px (1=4, 2=8, 3=12, 4=16, 5=20, 6=24, 8=32, 12=48, 16=64).
   Bordes:      radius sm 4, md 8, lg 12, full 9999. Border 1px.
   Sombras:     sm/md/lg/xl sutiles.
   Animaciones: fast 100ms / base 150ms / slow 250ms ease cubic-bezier(.4,0,.2,1).
   ========================================================================= */
:root {
  --c-primary: #1f3a64;
  --c-primary-600: #1a3257;
  --c-primary-700: #142844;
  --c-primary-50: #eaf0fa;
  --c-accent: #16a34a;
  --c-accent-600: #15803d;
  --c-success: #16a34a;
  --c-warning: #ea8a0e;
  --c-danger: #dc2626;
  --c-info: #0284c7;

  --c-bg: #f7f8fb;
  --c-bg-elev: #ffffff;
  --c-bg-soft: #eef1f6;
  --c-border: #e2e6ee;
  --c-border-strong: #cbd2de;
  --c-text: #0f172a;
  --c-text-muted: #58637a;
  --c-text-soft: #8a93a6;
  --c-text-inv: #ffffff;

  --c-row-hover: #f0f3f8;
  --c-overlay: rgba(15,23,42,0.46);

  /* Code badges */
  --c-x: #1f6feb;
  --c-r: #ea8a0e;
  --c-ra: #a855f7;
  --c-pm: #0ea5e9;
  --c-si: #16a34a;
  --c-causal: #d97706;
  --c-fs: #6b7280;
  --c-baja: #4b5563;
  --c-nu: #9ca3af;

  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-base: 14px;
  --fs-lg: 16px;
  --fs-xl: 19px;
  --fs-2xl: 24px;
  --fs-3xl: 32px;

  --fw-r: 400;
  --fw-m: 500;
  --fw-s: 600;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-12: 48px;
  --sp-16: 64px;

  --rd-sm: 4px;
  --rd-md: 8px;
  --rd-lg: 12px;
  --rd-full: 9999px;

  --sh-sm: 0 1px 2px rgba(15,23,42,.05);
  --sh-md: 0 2px 6px rgba(15,23,42,.08);
  --sh-lg: 0 8px 20px rgba(15,23,42,.10);
  --sh-xl: 0 18px 40px rgba(15,23,42,.16);

  --dur-fast: 100ms;
  --dur-base: 150ms;
  --dur-slow: 250ms;
  --ease: cubic-bezier(.4,0,.2,1);

  --side-w: 232px;
  --side-w-collapsed: 64px;
  --header-h: 56px;

  --density: 1;
}

[data-theme="dark"] {
  --c-primary: #4f7dc0;
  --c-primary-600: #5d8acb;
  --c-primary-700: #7196d4;
  --c-primary-50: #15243d;
  --c-bg: #0d1117;
  --c-bg-elev: #161b22;
  --c-bg-soft: #1c232e;
  --c-border: #2a313d;
  --c-border-strong: #3a4250;
  --c-text: #e6edf3;
  --c-text-muted: #9fa9bd;
  --c-text-soft: #6e7889;
  --c-row-hover: #1e2530;
  --c-overlay: rgba(0,0,0,0.65);
  --sh-sm: 0 1px 2px rgba(0,0,0,.5);
  --sh-md: 0 2px 6px rgba(0,0,0,.55);
  --sh-lg: 0 8px 20px rgba(0,0,0,.55);
  --sh-xl: 0 18px 40px rgba(0,0,0,.7);
}

[data-density="compact"] { --density: 0.85; }
[data-density="cozy"] { --density: 1; }
[data-density="comfortable"] { --density: 1.15; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
  font-size: var(--fs-base);
  color: var(--c-text);
  background: var(--c-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

a { color: var(--c-primary); text-decoration: none; }
a:hover { text-decoration: underline; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--c-border-strong); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ===== Layout ===== */
.app {
  display: grid;
  grid-template-columns: var(--side-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-areas: "side header" "side main";
  height: 100vh;
  width: 100vw;
}
.app[data-side-collapsed="1"] { grid-template-columns: var(--side-w-collapsed) 1fr; }
.app[data-mobile="1"] {
  grid-template-columns: 1fr;
  grid-template-rows: var(--header-h) 1fr 56px;
  grid-template-areas: "header" "main" "bottom";
}
.app[data-mobile="1"] .sidebar { display: none; }
.app[data-mobile="1"] .bottom-nav { display: flex; }

.sidebar {
  grid-area: side;
  background: var(--c-bg-elev);
  border-right: 1px solid var(--c-border);
  display: flex;
  flex-direction: column;
  padding: var(--sp-3) var(--sp-2);
  gap: 2px;
  overflow-y: auto;
  transition: width var(--dur-slow) var(--ease);
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  margin-bottom: var(--sp-3);
  font-weight: var(--fw-s);
  font-size: var(--fs-lg);
  color: var(--c-primary);
}
.brand-logo { width: 32px; height: 32px; flex-shrink: 0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: calc(var(--sp-2) * var(--density)) var(--sp-3);
  border-radius: var(--rd-md);
  cursor: pointer;
  color: var(--c-text-muted);
  font-weight: var(--fw-m);
  border: none;
  background: transparent;
  text-align: left;
  width: 100%;
  font-size: var(--fs-sm);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  position: relative;
}
.nav-item:hover { background: var(--c-bg-soft); color: var(--c-text); }
.nav-item.active { background: var(--c-primary-50); color: var(--c-primary); font-weight: var(--fw-s); }
.nav-item .nav-badge {
  margin-left: auto;
  background: var(--c-danger);
  color: white;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: var(--rd-full);
  font-weight: var(--fw-s);
}
.app[data-side-collapsed="1"] .nav-item span.lbl,
.app[data-side-collapsed="1"] .brand span:not(.brand-logo) { display: none; }

.header {
  grid-area: header;
  background: var(--c-bg-elev);
  border-bottom: 1px solid var(--c-border);
  display: flex;
  align-items: center;
  padding: 0 var(--sp-4);
  gap: var(--sp-3);
  z-index: 50;
}
.header-search {
  flex: 1;
  max-width: 640px;
  position: relative;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.main {
  grid-area: main;
  overflow-y: auto;
  padding: var(--sp-5);
}
.main.cross-fade { animation: fadein var(--dur-base) var(--ease); }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.bottom-nav {
  grid-area: bottom;
  display: none;
  background: var(--c-bg-elev);
  border-top: 1px solid var(--c-border);
  justify-content: space-around;
  align-items: center;
}
.bottom-nav .nav-item {
  flex-direction: column;
  gap: 2px;
  padding: 4px;
  font-size: 10px;
}
.bottom-nav .nav-item .lbl { font-size: 10px; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 7px 14px;
  border-radius: var(--rd-md);
  border: 1px solid transparent;
  background: var(--c-bg-soft);
  color: var(--c-text);
  font-weight: var(--fw-m);
  font-size: var(--fs-sm);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  user-select: none;
  white-space: nowrap;
}
.btn:hover { background: var(--c-border); }
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--c-primary); color: var(--c-text-inv); border-color: var(--c-primary); }
.btn-primary:hover { background: var(--c-primary-600); }
.btn-secondary { background: var(--c-bg-elev); border-color: var(--c-border-strong); color: var(--c-text); }
.btn-secondary:hover { background: var(--c-bg-soft); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--c-bg-soft); }
.btn-danger { background: var(--c-danger); color: white; border-color: var(--c-danger); }
.btn-danger:hover { background: #b91c1c; }
.btn-success { background: var(--c-success); color: white; border-color: var(--c-success); }
.btn-icon { padding: 7px; }
.btn-sm { padding: 4px 10px; font-size: var(--fs-xs); }
.btn-lg { padding: 10px 18px; font-size: var(--fs-base); }

/* ===== Inputs ===== */
.input, .select, .textarea {
  width: 100%;
  background: var(--c-bg-elev);
  border: 1px solid var(--c-border-strong);
  border-radius: var(--rd-md);
  padding: 7px 12px;
  color: var(--c-text);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  font-size: var(--fs-sm);
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px var(--c-primary-50);
}
.textarea { resize: vertical; min-height: 70px; font-family: inherit; }
.input-group {
  position: relative;
  display: flex;
  align-items: center;
}
.input-group .input { padding-left: 36px; }
.input-group .ig-icon {
  position: absolute;
  left: 10px;
  color: var(--c-text-soft);
  pointer-events: none;
}
.input-group .ig-clear {
  position: absolute;
  right: 8px;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--c-text-soft);
  padding: 4px;
  border-radius: var(--rd-sm);
}
.input-group .ig-clear:hover { background: var(--c-bg-soft); color: var(--c-text); }

.checkbox, .radio { width: 16px; height: 16px; accent-color: var(--c-primary); cursor: pointer; }
.switch {
  position: relative; width: 36px; height: 20px;
  background: var(--c-border-strong); border-radius: var(--rd-full);
  cursor: pointer; transition: background var(--dur-fast) var(--ease);
}
.switch::after {
  content: ''; position: absolute; left: 2px; top: 2px;
  width: 16px; height: 16px; background: white; border-radius: 50%;
  transition: transform var(--dur-fast) var(--ease);
}
.switch.on { background: var(--c-primary); }
.switch.on::after { transform: translateX(16px); }

label.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--sp-3); font-size: var(--fs-sm); }
label.field > .lbl { font-weight: var(--fw-m); color: var(--c-text-muted); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .03em; }
.field-row { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

/* ===== Cards ===== */
.card {
  background: var(--c-bg-elev);
  border: 1px solid var(--c-border);
  border-radius: var(--rd-lg);
  padding: var(--sp-4);
  box-shadow: var(--sh-sm);
}
.card-interactive { cursor: pointer; transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.card-interactive:hover { transform: translateY(-2px); box-shadow: var(--sh-md); }
.card-stat {
  display: flex; flex-direction: column; gap: var(--sp-1);
  padding: var(--sp-5);
}
.card-stat .stat-label { color: var(--c-text-muted); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .03em; }
.card-stat .stat-value { font-size: var(--fs-3xl); font-weight: var(--fw-s); color: var(--c-text); line-height: 1; margin-top: 2px; }
.card-stat .stat-extra { font-size: var(--fs-xs); color: var(--c-text-muted); margin-top: var(--sp-1); }

/* ===== Badges ===== */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: var(--rd-full);
  font-size: var(--fs-xs); font-weight: var(--fw-s);
  background: var(--c-bg-soft); color: var(--c-text-muted);
  white-space: nowrap;
}
.badge-success { background: #dcfce7; color: #15803d; }
.badge-warning { background: #fef3c7; color: #b45309; }
.badge-danger { background: #fee2e2; color: #b91c1c; }
.badge-info { background: #dbeafe; color: #1d4ed8; }
.badge-neutral { background: var(--c-bg-soft); color: var(--c-text-muted); }
[data-theme="dark"] .badge-success { background: #14532d; color: #bbf7d0; }
[data-theme="dark"] .badge-warning { background: #78350f; color: #fed7aa; }
[data-theme="dark"] .badge-danger { background: #7f1d1d; color: #fecaca; }
[data-theme="dark"] .badge-info { background: #1e3a8a; color: #bfdbfe; }

.badge-x { background: var(--c-x); color: white; }
.badge-r { background: var(--c-r); color: white; }
.badge-ra { background: var(--c-ra); color: white; }
.badge-pm { background: var(--c-pm); color: white; }
.badge-si { background: var(--c-si); color: white; }
.badge-fs { background: var(--c-fs); color: white; }
.badge-baja { background: var(--c-baja); color: white; }
.badge-nu { background: var(--c-nu); color: white; }
.badge-causal { background: var(--c-causal); color: white; }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-green { background: var(--c-success); }
.dot-orange { background: var(--c-warning); animation: pulseDot 1.6s var(--ease) infinite; }
.dot-red { background: var(--c-danger); }
.dot-blue { background: var(--c-info); }
@keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.state-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: var(--rd-full); font-size: var(--fs-xs); font-weight: var(--fw-m);
}
.state-pill.operativo { background: #dcfce7; color: #15803d; }
.state-pill.no-op { background: #fee2e2; color: #b91c1c; }
.state-pill.servicio { background: #fef3c7; color: #b45309; }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; border: 1px solid var(--c-border); border-radius: var(--rd-lg); background: var(--c-bg-elev); }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.table th, .table td {
  padding: calc(8px * var(--density)) var(--sp-3);
  text-align: left;
  border-bottom: 1px solid var(--c-border);
  vertical-align: middle;
}
.table th {
  background: var(--c-bg-soft);
  color: var(--c-text-muted);
  font-weight: var(--fw-s);
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: .03em;
  position: sticky;
  top: 0;
  z-index: 2;
  cursor: pointer;
  white-space: nowrap;
}
.table tr:last-child td { border-bottom: none; }
.table-sortable th:hover { background: var(--c-border); }
.table tr.row-link { cursor: pointer; }
.table tr.row-link:hover { background: var(--c-row-hover); }
.table-dense th, .table-dense td { padding: 4px 8px; font-size: var(--fs-xs); }

/* ===== Tabs ===== */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--c-border); margin-bottom: var(--sp-4); overflow-x: auto; }
.tab {
  padding: 8px 14px; border: none; background: transparent;
  cursor: pointer; color: var(--c-text-muted); font-weight: var(--fw-m);
  border-bottom: 2px solid transparent;
  white-space: nowrap; font-size: var(--fs-sm);
}
.tab:hover { color: var(--c-text); }
.tab.active { color: var(--c-primary); border-color: var(--c-primary); font-weight: var(--fw-s); }
.tabs-pill { border-bottom: none; gap: 6px; }
.tabs-pill .tab { border-radius: var(--rd-full); border: 1px solid var(--c-border); padding: 5px 12px; }
.tabs-pill .tab.active { background: var(--c-primary); color: white; border-color: var(--c-primary); }

/* ===== Modal ===== */
.modal-backdrop {
  position: fixed; inset: 0; background: var(--c-overlay);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  animation: fadein var(--dur-base) var(--ease);
  padding: var(--sp-4);
}
.modal {
  background: var(--c-bg-elev);
  border-radius: var(--rd-lg);
  box-shadow: var(--sh-xl);
  width: min(720px, 100%);
  max-height: 92vh;
  display: flex; flex-direction: column;
  animation: modalIn var(--dur-base) var(--ease);
}
.modal-lg { width: min(1080px, 100%); }
.modal-sm { width: min(480px, 100%); }
.modal-fullscreen { width: 100%; height: 100%; max-height: 100vh; border-radius: 0; }
@keyframes modalIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--c-border);
}
.modal-title { font-size: var(--fs-lg); font-weight: var(--fw-s); margin: 0; }
.modal-body {
  padding: var(--sp-5);
  overflow-y: auto;
  flex: 1;
}
.modal-footer {
  padding: var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--c-border);
  display: flex; gap: var(--sp-2); justify-content: flex-end;
  flex-wrap: wrap;
}

/* ===== Toast ===== */
.toast-stack {
  position: fixed; bottom: var(--sp-5); right: var(--sp-5);
  display: flex; flex-direction: column-reverse; gap: var(--sp-2);
  z-index: 5000;
  max-width: 360px;
}
.toast {
  background: var(--c-bg-elev);
  border: 1px solid var(--c-border);
  border-left: 3px solid var(--c-primary);
  box-shadow: var(--sh-lg);
  border-radius: var(--rd-md);
  padding: var(--sp-3) var(--sp-4);
  display: flex; align-items: center; gap: var(--sp-3);
  animation: toastIn var(--dur-base) var(--ease);
  font-size: var(--fs-sm);
}
.toast.success { border-left-color: var(--c-success); }
.toast.warning { border-left-color: var(--c-warning); }
.toast.danger { border-left-color: var(--c-danger); }
.toast-action { margin-left: auto; }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

/* ===== Empty state / skeleton ===== */
.empty-state {
  text-align: center; padding: var(--sp-12);
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
  color: var(--c-text-muted);
}
.empty-state .es-icon { color: var(--c-border-strong); }
.empty-state h3 { margin: 0; font-size: var(--fs-lg); color: var(--c-text); }
.empty-state p { margin: 0; max-width: 360px; }

  font-weight: var(--fw-m);

  position: absolute;
  background: var(--c-bg-elev);

  border-radius: var(--rd-md);
  box-shadow: var(--sh-lg);

  padding: 4px;

  right: 0;
  top: 100%;

  cursor: pointer; font-size: var(--fs-sm);

  bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);

.stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }

.muted { color: var(--c-text-muted); }

h3 { font-size: var(--fs-lg); font-weight: var(--fw-s); margin: 0 0 var(--sp-2); }

@media print {

  .modal-backdrop { position: static; background: white; padding: 0; }
  .modal { box-shadow: none; max-height: none; width: 100% !important; }
  .modal-body { overflow: visible; }
  table { page-break-inside: auto; }
  tr { page-break-inside: avoid; }

.wizard-overlay {

details.tutorial ol { margin: var(--sp-2) 0 0; padding-left: var(--sp-5); }

.hl { background: #fef08a !important; color: black !important; padding: 0 2px; border-radius: 2px; }

.banner-offline {
  background: var(--c-warning); color: white;
  padding: 6px var(--sp-4); text-align: center; font-size: var(--fs-xs); font-weight: var(--fw-m);

/* QR canvas */
.qr-canvas { background: white; padding: var(--sp-3); border-radius: var(--rd-md); display: inline-block; }

@media (max-width: 1023px) {
  .header-search { display: none; }

/* ===== Toast / Confirm ===== */
const Toast = {
  show(msg, opts) {
    opts = opts || {};
    const t = el('div', { class: 'toast' + (opts.type ? ' ' + opts.type : '') });
    t.innerHTML = '<span>' + escapeHtml(msg) + '</span>';
    let timer; let resolved = false;
    if (opts.action) {
      const btn = el('button', { class: 'btn btn-sm btn-ghost toast-action', html: opts.action });
      btn.addEventListener('click', () => {
        resolved = true; clearTimeout(timer);
        try { opts.onAction && opts.onAction(); } catch (e) {}
        t.remove();
      });
      t.appendChild(btn);
    }
    t.addEventListener('mouseenter', () => clearTimeout(timer));
    t.addEventListener('mouseleave', () => { if (!resolved) timer = setTimeout(() => t.remove(), 1500); });
    $('#toastStack').appendChild(t);
    timer = setTimeout(() => {
      if (!resolved) { resolved = true; t.remove(); try { opts.onConfirm && opts.onConfirm(); } catch (e) {} }
    }, opts.duration || (opts.action ? 8000 : 4000));
    return t;
  },
  success(m, o) { return this.show(m, Object.assign({ type: 'success' }, o)); },
  warning(m, o) { return this.show(m, Object.assign({ type: 'warning' }, o)); },
  danger(m, o) { return this.show(m, Object.assign({ type: 'danger' }, o)); }
};

function confirmModal(opts) {
  return new Promise((resolve) => {
    const b = el('div', { class: 'modal-backdrop' });
    const m = el('div', { class: 'modal modal-sm' });
    m.innerHTML = '<div class="modal-header"><h3 class="modal-title">' + escapeHtml(opts.title || 'Confirmar') + '</h3></div>' +
      '<div class="modal-body">' + escapeHtml(opts.message || '¿Estás seguro?') + (opts.detail ? '<div class="muted tiny mt-2">' + escapeHtml(opts.detail) + '</div>' : '') + '</div>' +
      '<div class="modal-footer"><button class="btn btn-ghost" data-act="cancel">' + escapeHtml(opts.cancelText || 'Cancelar') + '</button>' +
      '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-act="ok">' + escapeHtml(opts.okText || 'Confirmar') + '</button></div>';
    b.appendChild(m);
    b.addEventListener('click', (e) => { if (e.target === b) { b.remove(); resolve(false); } });
    m.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const ok = a.dataset.act === 'ok';
      b.remove(); resolve(ok);
    });
    document.getElementById('modalRoot').appendChild(b);
  });
}

function openModal(content, opts) {
  opts = opts || {};
  const b = el('div', { class: 'modal-backdrop' });
  const m = el('div', { class: 'modal ' + (opts.size ? 'modal-' + opts.size : '') });
  if (typeof content === 'string') m.innerHTML = content;
  else m.appendChild(content);
  b.appendChild(m);
  const close = () => { b.classList.add('closing'); b.remove(); };
  b.addEventListener('click', (e) => { if (e.target === b && opts.dismissable !== false) close(); });
  m.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', close));
  document.getElementById('modalRoot').appendChild(b);
  return { backdrop: b, modal: m, close };
}

/* ===== API client ===== */
async function api(action, payload, opts) {
  opts = opts || {};
  if (!MP.config.WEB_APP_URL || !MP.config.API_TOKEN) {
    throw new Error('config_incompleta');
  }
  if (MP.modoOfflineForzado && !opts.bypassOffline) {
    throw new Error('offline_forzado');
  }
  const body = JSON.stringify({
    action,
    payload: payload || {},
    token: MP.config.API_TOKEN,
    sheetId: MP.config.SPREADSHEET_ID
  });
  const ctrl = new AbortController();
  const tm = setTimeout(() => ctrl.abort(), opts.timeout || 60000);
  try {
    const res = await fetch(MP.config.WEB_APP_URL, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body,
      signal: ctrl.signal,
      redirect: 'follow'
    });
    clearTimeout(tm);
    if (!res.ok) throw new Error('http_' + res.status);
    const txt = await res.text();
    let json;
    try { json = JSON.parse(txt); }
    catch (e) { throw new Error('parse_error:' + txt.slice(0, 80)); }
    if (json.error === 'unauthorized') throw new Error('unauthorized');
    return json;
  } catch (e) {
    clearTimeout(tm);
    throw e;
  }
}

/* ===== Sync queue (offline-first) ===== */
const Queue = {
  add(action, payload, opts) {
    opts = opts || {};
    const item = {
      id: 'q_' + uid(),
      localId: opts.localId || null,
      action, payload,
      intentos: 0,
      creadoEn: Date.now(),
      ultimoIntento: 0,
      ultimoError: '',
      estado: 'pendiente' // pendiente | en_curso | conflicto | descartado
    };
    MP.queue.push(item);
    lsSet(LS.queue, MP.queue);
    updateSyncIndicator();
    this.process(); // intenta inmediato
    return item.id;
  },
  remove(id) {
    MP.queue = MP.queue.filter((q) => q.id !== id);
    lsSet(LS.queue, MP.queue);
    updateSyncIndicator();
  },
  clear() {
    MP.queue = [];
    lsSet(LS.queue, MP.queue);
    updateSyncIndicator();
  },
  retryAll() {
    MP.queue.forEach((q) => { q.intentos = 0; q.ultimoError = ''; q.estado = 'pendiente'; });
    lsSet(LS.queue, MP.queue);
    this.process();
  },
  _running: false,
  _paused: false,
  async process() {
    if (this._running || this._paused) return;
    if (!MP.config.WEB_APP_URL || !MP.config.API_TOKEN) return;
    this._running = true;
    try {
      while (MP.queue.length) {
        const item = MP.queue.find((q) => q.estado === 'pendiente' || q.estado === 'en_curso');
        if (!item) break;
        const wait = backoffMs(item.intentos);
        const since = Date.now() - (item.ultimoIntento || 0);
        if (item.ultimoIntento && since < wait) {
          break; // esperar
        }
        item.estado = 'en_curso';
        item.intentos++;
        item.ultimoIntento = Date.now();
        lsSet(LS.queue, MP.queue);
        updateSyncIndicator();
        try {
          const r = await api(item.action, item.payload);
          if (r && r.ok === false) {
            item.ultimoError = String(r.error || 'unknown');
            if (item.intentos >= 8) { item.estado = 'conflicto'; }
            else item.estado = 'pendiente';
          } else {
            this.remove(item.id);
            MP.ultimoSyncOk = Date.now();
            invalidateRelevantCache(item.action);
          }
        } catch (e) {
          item.ultimoError = String(e && e.message || e);
          if (item.intentos >= 12) item.estado = 'conflicto';
          else item.estado = 'pendiente';
          lsSet(LS.queue, MP.queue);
          updateSyncIndicator();
          break; // backoff
        }
      }
    } finally {
      this._running = false;
      updateSyncIndicator();
      // schedule next pass if items remain
      const pending = MP.queue.filter((q) => q.estado === 'pendiente');
      if (pending.length) {
        const minWait = Math.min.apply(null, pending.map((q) => backoffMs(q.intentos) - (Date.now() - q.ultimoIntento)));
        setTimeout(() => this.process(), Math.max(500, minWait || 1000));
      }
    }
  }
};
function backoffMs(intentos) {
  const seq = [1000, 2000, 5000, 15000, 60000, 300000, 1800000];
  return seq[Math.min(intentos, seq.length - 1)];
}
function invalidateRelevantCache(action) {
  const ev = ['saveEvento','deleteEvento'];
  const pe = ['savePendiente','togglePendiente','deletePendiente'];
  if (ev.includes(action)) MP.eventos.ts = 0;
  if (pe.includes(action)) MP.pendientes.ts = 0;
  if (['saveReprogramacion','deleteReprogramacion'].includes(action)) MP.reprogs.ts = 0;
  if (['saveResultadoOverride','deleteResultadoOverride'].includes(action)) { MP.overrides.ts = 0; MP.kpis.ts = 0; MP.equipos.ts = 0; }
  if (['saveAsignacion'].includes(action)) MP.asignaciones.ts = 0;
}

/* ===== Sync indicator ===== */
function updateSyncIndicator() {
  const pill = $('#syncPill'); if (!pill) return;
  const cnt = MP.queue.filter((q) => q.estado !== 'descartado').length;
  const conflict = MP.queue.filter((q) => q.estado === 'conflicto').length;
  pill.classList.remove('ok','pending','err');
  if (conflict > 0 && cnt === conflict) { pill.classList.add('err'); pill.innerHTML = icon('cloud-off',14) + '<span>' + cnt + ' conflicto' + (cnt > 1 ? 's' : '') + '</span>'; }
  else if (cnt > 0) { pill.classList.add('pending'); pill.innerHTML = '<span class="dot dot-orange"></span><span>' + cnt + ' en cola</span>'; }
  else { pill.classList.add('ok'); pill.innerHTML = icon('check-circle',14) + '<span>Sincronizado</span>'; }
  // sidebar badge pendientes vencidos
  const pendVen = (MP.pendientes.data || []).filter((p) => p.estado === 'abierto' && p.fechaCompromiso && new Date(p.fechaCompromiso) < new Date(todayISO())).length;
  $$('.nav-item[data-vista="pendientes"] .nav-badge').forEach((b) => { if (pendVen > 0) { b.textContent = pendVen; b.style.display = ''; } else b.style.display = 'none'; });
}

async function recargarTodo(opts) {
  opts = opts || {};
  if (!MP.config.WEB_APP_URL || !MP.config.API_TOKEN) return;
  try {
    const [eq, pe, ev, re, ov, asn, ic] = await Promise.all([
      api('getEquipos', { nocache: opts.force }),
      api('getPendientes', {}),
      api('getEventos', {}),
      api('getReprogs', {}),
      api('getOverrides', {}),
      api('getAsignaciones', {}),
      api('getInconsistencias', {})
    ]);
    if (eq.ok) { MP.equipos = { ts: Date.now(), data: eq.data }; saveCache(LS.cacheEq, MP.equipos); }
    if (pe.ok) { MP.pendientes = { ts: Date.now(), data: pe.data }; saveCache(LS.cachePend, MP.pendientes); }
    if (ev.ok) { MP.eventos = { ts: Date.now(), data: ev.data }; saveCache(LS.cacheEv, MP.eventos); }
    if (re.ok) { MP.reprogs = { ts: Date.now(), data: re.data }; saveCache(LS.cacheReprog, MP.reprogs); }
    if (ov.ok) { MP.overrides = { ts: Date.now(), data: ov.data }; saveCache(LS.cacheOver, MP.overrides); }
    if (asn.ok) { MP.asignaciones = { ts: Date.now(), data: asn.data }; saveCache(LS.cacheAsign, MP.asignaciones); }
    if (ic.ok) { MP.inconsistencias = { ts: Date.now(), data: ic.data }; saveCache(LS.cacheInc, MP.inconsistencias); }
    calcularKPIsLocal();
    updateSyncIndicator();
    if (currentView) renderView(currentView);
    return true;
  } catch (e) {
    console.warn('recargarTodo error', e);
    MP.syncStatus = 'offline';
    updateSyncIndicator();
    return false;
  }
}

function calcularKPIsLocal() {
  const equipos = MP.equipos.data || [];
  const overrides = MP.overrides.data || {};
  const month = new Date().getMonth();
  let programadas = 0, programadasMes = 0, ejecutadas = 0, ejecutadasMes = 0, fsbn = 0;
  const porFamilia = {}; const porMes = [];
  for (let m = 0; m < 12; m++) porMes.push({ programadas: 0, ejecutadas: 0, causales: 0, fs: 0, pendientes: 0 });
  equipos.forEach((eq) => {
    if (eq.isSlot) return;
    porFamilia[eq.familiaCalc] = (porFamilia[eq.familiaCalc] || 0) + 1;
    for (let m = 0; m < 12; m++) {
      const p = eq.mesesP[m];
      const reg = eq.mesesReg[m] || {};
      let r = reg.r;
      const ov = (overrides[eq.key] || {})[m];
      if (ov) r = ov;
      if (p === 'X' || p === 'R' || p === 'RA' || p === 'PM') {
        programadas++; porMes[m].programadas++;
        if (m === month) programadasMes++;
      }
      if (r === 'Si' || r === 'Si-RA') {
        ejecutadas++; porMes[m].ejecutadas++;
        if (m === month) ejecutadasMes++;
      } else if (r === 'FS' || r === 'Baja' || r === 'NU') { fsbn++; porMes[m].fs++; }
      else if (r && r.charAt(0) === 'C') porMes[m].causales++;
    }
  });
  for (let m = 0; m < 12; m++) {
    porMes[m].pendientes = Math.max(0, porMes[m].programadas - porMes[m].ejecutadas - porMes[m].fs - porMes[m].causales);
  }
  const pendientes = Math.max(0, programadas - ejecutadas - fsbn);
  MP.kpis = { ts: Date.now(), data: { programadas, programadasMes, ejecutadas, ejecutadasMes, pendientes, fsbn, porFamilia, porMes, cumplimiento: programadas ? Math.round(ejecutadas * 100 / programadas) : 0 } };
  saveCache(LS.cacheKpi, MP.kpis);
}

/* ===== Router ===== */
let currentView = null;
function navigate(vista) {
  if (vista === currentView) { renderView(vista); return; }
  currentView = vista;
  MP.uiState.vista = vista;
  saveUiState();
  if (location.hash !== '#' + vista) location.hash = '#' + vista;
  $$('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.vista === vista));
  renderView(vista);
}
window.addEventListener('hashchange', () => {
  const v = location.hash.replace('#','') || 'inicio';
  if (v !== currentView && VISTAS.find((x) => x.id === v)) navigate(v);
});
window.addEventListener('resize', debounce(() => renderShell(), 200));

function renderView(vista) {
  const main = $('#main');
  main.classList.remove('cross-fade');
  void main.offsetWidth;
  main.classList.add('cross-fade');
  // sync banner si offline
  const cacheOldMs = Date.now() - (MP.equipos.ts || 0);
  let bannerHtml = '';
  if (MP.modoOfflineForzado) bannerHtml = '<div class="banner-offline">' + icon('cloud-off',14) + ' Modo offline forzado. Acumulando cambios en cola.</div>';
  else if (MP.queue.some((q) => q.estado === 'conflicto')) bannerHtml = '<div class="banner-offline">Hay cambios en conflicto. Revisa en Configuración → Sincronización.</div>';
  main.innerHTML = bannerHtml + '<div id="viewBody"></div>';
  const body = $('#viewBody');
  switch (vista) {
    case 'inicio': renderInicio(body); break;
    case 'buscar': renderBuscar(body); break;
    case 'pendientes': renderPendientes(body); break;
    case 'calendario': renderCalendario(body); break;
    case 'plantilla': renderPlantilla(body); break;
    case 'verificacion': renderVerificacion(body); break;
    case 'config': renderConfig(body); break;
    default: navigate('inicio');
  }
  $$('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.vista === vista));
}

function renderChart(porMes) {
  const wrap = el('div', { class: 'chart-bar' });
  const max = Math.max.apply(null, porMes.map((m) => m.programadas).concat([1]));
  porMes.forEach((m, i) => {
    const row = el('div', { class: 'chart-row' });
    row.appendChild(el('span', { class: 'tiny muted', text: MESES[i] }));
    const track = el('div', { class: 'chart-track' });
    const total = m.programadas || 1;
    const pct = (n) => Math.round((n / total) * 100) || 0;
    const sEj = el('div', { class: 'chart-seg', style: 'background:var(--c-success);width:' + pct(m.ejecutadas) + '%', dataset: { tip: 'Ejecutadas: ' + m.ejecutadas }, 'data-tip': '' });
    const sFs = el('div', { class: 'chart-seg', style: 'background:var(--c-fs);width:' + pct(m.fs) + '%' });
    const sCau = el('div', { class: 'chart-seg', style: 'background:var(--c-causal);width:' + pct(m.causales) + '%' });
    const sPen = el('div', { class: 'chart-seg', style: 'background:var(--c-warning);width:' + pct(m.pendientes) + '%' });
    track.appendChild(sEj); track.appendChild(sFs); track.appendChild(sCau); track.appendChild(sPen);
    row.appendChild(track);
    row.appendChild(el('span', { class: 'tiny right', text: m.ejecutadas + '/' + m.programadas }));
    row.addEventListener('click', () => abrirDetalleMes(i + 1));
    wrap.appendChild(row);
  });
  // leyenda
  const leg = el('div', { class: 'row tiny mt-2', style: 'gap:14px' }, [
    el('span', { html: '<span class="dot" style="background:var(--c-success)"></span> Ejecutadas' }),
    el('span', { html: '<span class="dot" style="background:var(--c-causal)"></span> Causal' }),
    el('span', { html: '<span class="dot" style="background:var(--c-fs)"></span> FS/Baja/NU' }),
    el('span', { html: '<span class="dot" style="background:var(--c-warning)"></span> Pendientes' })
  ]);
  const out = el('div'); out.appendChild(wrap); out.appendChild(leg); return out;
}

function codigoBadge(c) {
  if (!c) return '<span class="muted">—</span>';
  const u = String(c).toLowerCase();
  let cls = 'badge-neutral';
  if (c === 'X') cls = 'badge-x';
  else if (c === 'R') cls = 'badge-r';
  else if (c === 'RA') cls = 'badge-ra';
  else if (c === 'PM') cls = 'badge-pm';
  else if (c === 'Si' || c === 'Si-RA') cls = 'badge-si';
  else if (c === 'FS') cls = 'badge-fs';
  else if (c === 'Baja') cls = 'badge-baja';
  else if (c === 'NU') cls = 'badge-nu';
  else if (/^C[1-8]$/.test(c)) cls = 'badge-causal';
  return '<span class="badge ' + cls + '">' + escapeHtml(c) + '</span>';
}

function filtrarYAbrir(opts) {
  if (opts.tipo === 'programadas' || opts.tipo === 'ejecutadas' || opts.tipo === 'pendientes') {
    abrirListaFiltrada(opts.tipo);
  } else if (opts.tipo === 'st') {
    MP.uiState.filtros = { causalActiva: 'C2' }; navigate('buscar');
  } else if (opts.tipo === 'fs') {
    MP.uiState.filtros = { resultado: 'FS' }; navigate('buscar');
  }
}

function abrirListaFiltrada(tipo) {
  const overrides = MP.overrides.data || {};
  const asign = MP.asignaciones.data || {};
  const filas = [];
  (MP.equipos.data || []).forEach((eq) => {
    if (eq.isSlot) return;
    for (let m = 0; m < 12; m++) {
      const p = eq.mesesP[m];
      let r = (eq.mesesReg[m] || {}).r;
      const ov = (overrides[eq.key] || {})[m];
      if (ov) r = ov;
      const programada = (p === 'X' || p === 'R' || p === 'RA' || p === 'PM');
      const ejecutada = (r === 'Si' || r === 'Si-RA');
      const cerrada = ejecutada || r === 'FS' || r === 'Baja' || r === 'NU';
      let incluir = false;
      if (tipo === 'programadas' && programada) incluir = true;
      if (tipo === 'ejecutadas' && ejecutada) incluir = true;
      if (tipo === 'pendientes' && programada && !cerrada) incluir = true;
      if (incluir) {
        filas.push({ eq, mes: m + 1, cod: p, resultado: r, responsable: (asign[eq.key] || {})[m] || '' });
      }
    }
  });
  abrirModalLista(tipo, filas);
}

function abrirModalLista(tipo, filas) {
  const root = el('div');
  root.innerHTML = '<div class="modal-header"><h3 class="modal-title">' + ({ programadas: 'Programadas', ejecutadas: 'Ejecutadas', pendientes: 'Pendientes' }[tipo]) + ' · ' + filas.length + '</h3><button class="btn btn-icon btn-ghost" data-close>' + icon('x') + '</button></div>';
  const body = el('div', { class: 'modal-body' });
  const filtros = el('div', { class: 'row mb-3' });
  const selResp = el('select', { class: 'select' });
  selResp.appendChild(el('option', { value: '', text: 'Todos responsables' }));
  EJECUTORES_DEFAULT.forEach((e) => selResp.appendChild(el('option', { value: e, text: e })));
  const selMes = el('select', { class: 'select' });
  selMes.appendChild(el('option', { value: '', text: 'Todos los meses' }));
  MESES.forEach((m, i) => selMes.appendChild(el('option', { value: i + 1, text: m })));
  filtros.appendChild(selResp); filtros.appendChild(selMes);
  const btnXls = el('button', { class: 'btn btn-secondary', html: icon('download',14) + ' Excel' });
  filtros.appendChild(btnXls);
  body.appendChild(filtros);

  const tabla = el('div'); body.appendChild(tabla);
  function pintar() {
    const f = filas.filter((x) => (!selResp.value || x.responsable === selResp.value) && (!selMes.value || x.mes === Number(selMes.value)));
    tabla.innerHTML = '';
    const tw = el('div', { class: 'table-wrap' });
    const t = el('table', { class: 'table' });
    t.innerHTML = '<thead><tr><th>Equipo</th><th>Inv</th><th>Servicio</th><th>Mes</th><th>Cód</th><th>Resultado</th><th>Responsable</th><th>Acción</th></tr></thead>';
    const tb = el('tbody');
    f.forEach((row) => {
      const tr = el('tr', { class: 'row-link' });
      tr.innerHTML = '<td>' + escapeHtml(row.eq.equipo) + '</td><td>' + escapeHtml(row.eq.inventario) + '</td><td>' + escapeHtml(row.eq.servicio) + '</td>' +
        '<td>' + MESES[row.mes - 1] + '</td><td>' + codigoBadge(row.cod) + '</td><td>' + codigoBadge(row.resultado || '') + '</td>' +
        '<td>' + escapeHtml(row.responsable || '—') + '</td><td><button class="btn btn-sm btn-ghost">Abrir</button></td>';
      tr.addEventListener('click', () => abrirFichaEquipo(row.eq.key));
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); tabla.appendChild(tw);
    if (!f.length) tabla.appendChild(emptyState('No hay coincidencias', 'Ajusta los filtros.'));
  }
  pintar();
  selResp.addEventListener('change', pintar);
  selMes.addEventListener('change', pintar);
  btnXls.addEventListener('click', () => exportListaExcel(tipo, filas));
  root.appendChild(body);
  root.appendChild(el('div', { class: 'modal-footer' }, [el('button', { class: 'btn btn-primary', text: 'Cerrar', dataset: { close: '1' } })]));
  openModal(root, { size: 'lg' });
}

    Object.keys(filtros).filter((k) => filtros[k]).length ? el('button', { class: 'btn btn-ghost btn-sm', html: icon('x',12) + ' Limpiar (' + Object.values(filtros).filter(Boolean).length + ')',
      onclick: () => { MP.uiState.filtros = {}; saveUiState(); renderView('buscar'); } }) : null
  ]));

  // Búsquedas recientes
  if (MP.recientes.length && !q) {
    const rec = el('div', { class: 'row tiny muted' }, [el('span', { text: 'Recientes:' })]);
    MP.recientes.slice(0, 6).forEach((r) => {
      const ch = el('button', { class: 'btn btn-sm btn-ghost', text: r });
      ch.addEventListener('click', () => { $('#globalSearch').value = r; $('#globalSearch').dispatchEvent(new Event('input')); });
      rec.appendChild(ch);
    });
    f.appendChild(rec);
  }
  root.appendChild(f);

  // Lista
  const equipos = filtrarEquipos(q, filtros);
  root.appendChild(el('div', { class: 'row-between mb-2' }, [
    el('div', { class: 'muted tiny', text: equipos.length + ' equipo' + (equipos.length === 1 ? '' : 's') }),
    el('button', { class: 'btn btn-sm btn-secondary', html: icon('download',12) + ' Exportar', onclick: () => exportarEquiposExcel(equipos) })
  ]));

  if (q && !MP.recientes.includes(q)) {
    MP.recientes.unshift(q);
    MP.recientes = MP.recientes.slice(0, 10);
    lsSet(LS.recientes, MP.recientes);
  }

  const list = el('div', { class: 'stack' });
  equipos.slice(0, 200).forEach((eq) => list.appendChild(equipoCard(eq, q)));
  if (!equipos.length) list.appendChild(emptyState('Sin resultados', 'Ajusta los filtros o limpia la búsqueda.', 'search'));
  if (equipos.length > 200) list.appendChild(el('div', { class: 'tiny muted center mt-2', text: 'Mostrando 200 de ' + equipos.length + '. Refina los filtros.' }));
  root.appendChild(list);
}

function serviciosUnicos() {
  const s = new Set(); (MP.equipos.data || []).forEach((eq) => { if (eq.servicio) s.add(eq.servicio); });

}

function selectFiltro(label, value, options, onChange) {
  const wrap = el('label', { class: 'row tiny', style: 'gap:6px' });

  options.forEach((o) => {
    const v = typeof o === 'object' ? o.value : o;
    const l = typeof o === 'object' ? o.label : o;
    const op = el('option', { value: v, text: l });

    s.appendChild(op);
  });

  wrap.appendChild(s);

}
function checkboxFiltro(label, checked, onChange) {

  c.addEventListener('change', () => onChange(c.checked));

}
function textoFiltro(label, value, onChange) {

function filtrarEquipos(q, filtros) {
  const eqs = MP.equipos.data || [];
  const pendByKey = pendientesByKey();
  const norm = normalize(q);
  let parsed = { libre: norm, inv: '', serie: '', servicio: '', marca: '', modelo: '', ubic: '' };
  const ops = ['inv','serie','servicio','marca','modelo','ubic'];
  if (q) {
    let libre = q;
    ops.forEach((o) => {
      const re = new RegExp(o + ':([^\\s]+)', 'i');
      const m = libre.match(re);
      if (m) { parsed[o] = normalize(m[1]); libre = libre.replace(re, '').trim(); }
    });
    parsed.libre = normalize(libre);
  }
  return eqs.filter((eq) => {
    if (eq.isSlot) return false;
    if (filtros.servicio && eq.servicio !== filtros.servicio) return false;
    if (filtros.familia && eq.familiaCalc !== filtros.familia) return false;
    if (filtros.mes && !eq.mesesP[Number(filtros.mes) - 1]) return false;
    if (filtros.responsable) {
      const as = (MP.asignaciones.data || {})[eq.key] || {};
      let found = false;
      for (let m = 0; m < 12; m++) if (as[m] === filtros.responsable) { found = true; break; }
      if (!found) return false;
    }
    if (filtros.causalActiva) {
      let found = false;
      for (let m = 0; m < 12; m++) {
        const r = (eq.mesesReg[m] || {}).r;
        if (r === filtros.causalActiva) { found = true; break; }
      }
      if (!found) return false;
    }
    if (filtros.resultado) {
      let found = false;
      for (let m = 0; m < 12; m++) {
        const r = (eq.mesesReg[m] || {}).r;
        if (r === filtros.resultado) { found = true; break; }
      }
      if (!found) return false;
    }
    if (filtros.conPend) {
      const arr = pendByKey[eq.key] || [];
      if (!arr.some((p) => p.estado === 'abierto')) return false;
    }
    // Filtros de texto directos (UI) — se combinan con los operadores del buscador global
    if (filtros.inv && normalize(eq.inventario).indexOf(normalize(filtros.inv)) < 0) return false;
    if (filtros.serie && normalize(eq.serie).indexOf(normalize(filtros.serie)) < 0) return false;
    if (filtros.carpeta && normalize(eq.carpeta).indexOf(normalize(filtros.carpeta)) < 0) return false;
    if (filtros.marca && normalize(eq.marca).indexOf(normalize(filtros.marca)) < 0) return false;
    if (filtros.modelo && normalize(eq.modelo).indexOf(normalize(filtros.modelo)) < 0) return false;
    if (parsed.inv && normalize(eq.inventario).indexOf(parsed.inv) < 0) return false;
    if (parsed.serie && normalize(eq.serie).indexOf(parsed.serie) < 0) return false;
    if (parsed.servicio && normalize(eq.servicio).indexOf(parsed.servicio) < 0) return false;
    if (parsed.marca && normalize(eq.marca).indexOf(parsed.marca) < 0) return false;
    if (parsed.modelo && normalize(eq.modelo).indexOf(parsed.modelo) < 0) return false;
    if (parsed.ubic && normalize(eq.ubicacion).indexOf(parsed.ubic) < 0) return false;
    if (parsed.libre) {
      const blob = normalize([eq.equipo, eq.inventario, eq.serie, eq.marca, eq.modelo, eq.ubicacion, eq.id].join('|'));
      if (blob.indexOf(parsed.libre) < 0) return false;
    }
    return true;
  });
}

function estadoEquipoCalc(eq) {
  // Recorre los meses del registro buscando el resultado más reciente
  let ultR = '';
  for (let m = 11; m >= 0; m--) {
    const r = (eq.mesesReg[m] || {}).r;
    if (r) { ultR = r; break; }
  }
  if (ultR === 'Baja' || /baja/i.test(eq.enuBaja || '')) return { label: 'Baja', cls: 'no-op' };
  if (ultR === 'FS') return { label: 'Fuera de servicio', cls: 'no-op' };
  if (ultR === 'C2') return { label: 'En servicio técnico', cls: 'servicio' };
  if (ultR === 'C3') return { label: 'Espera repuesto', cls: 'servicio' };
  if (ultR === 'C4') return { label: 'En préstamo', cls: 'servicio' };
  if (ultR === 'NU') return { label: 'No ubicable', cls: 'no-op' };
  return { label: eq.enuBaja || 'Operativo', cls: 'operativo' };
}

function equipoCard(eq, q) {
  const card = el('div', { class: 'eq-card' });
  function hl(text) {
    if (!q || !text) return escapeHtml(text || '');
    const norm = normalize(q);
    const stxt = String(text);
    const sn = normalize(stxt);
    const idx = sn.indexOf(norm);
    if (idx < 0) return escapeHtml(stxt);
    return escapeHtml(stxt.slice(0, idx)) + '<mark>' + escapeHtml(stxt.slice(idx, idx + norm.length)) + '</mark>' + escapeHtml(stxt.slice(idx + norm.length));
  }
  let mesesHtml = '';
  for (let m = 0; m < 12; m++) {
    const p = eq.mesesP[m];
    const r = (eq.mesesReg[m] || {}).r;
    if (p || r) {
      const code = r || p;
      mesesHtml += '<span title="' + MESES[m] + (r ? ' ' + r : '') + '" style="margin:0 2px">' + codigoBadge(code) + '</span>';
    }
  }
  // Pendientes abiertos
  const pends = (pendientesByKey()[eq.key] || []).filter((p) => p.estado === 'abierto');
  const venc = pends.filter((p) => p.fechaCompromiso && new Date(p.fechaCompromiso) < new Date(todayISO())).length;
  // Estado del equipo
  const est = estadoEquipoCalc(eq);
  // Línea principal con badges (familia + estado + pendientes)
  const badges = '<span class="badge badge-neutral">' + escapeHtml(eq.familiaCalc) + '</span>' +
    ' <span class="state-pill ' + est.cls + '"><span class="dot ' + (est.cls === 'operativo' ? 'dot-green' : est.cls === 'servicio' ? 'dot-orange' : 'dot-red') + '"></span>' + escapeHtml(est.label) + '</span>' +
    (pends.length ? ' <span class="badge ' + (venc ? 'badge-danger' : 'badge-warning') + '">' + icon('list',10) + ' ' + pends.length + (venc ? ' (' + venc + ' venc.)' : '') + '</span>' : '');
  card.innerHTML = '<div class="row-between">' +
    '<div class="eq-name">' + hl(eq.equipo) + ' ' + badges + '</div>' +
    '<div class="row tiny muted">' + mesesHtml + '</div>' +
    '</div>' +
    '<div class="eq-meta">Inv: <strong>' + hl(eq.inventario) + '</strong> · Carpeta: <strong>' + hl(eq.carpeta || '—') + '</strong> · Serie: ' + hl(eq.serie) + ' · ' + hl(eq.marca + ' ' + eq.modelo) + '</div>' +
    '<div class="eq-meta">' + hl(eq.servicio) + (eq.ubicacion ? ' · ' + hl(eq.ubicacion) : '') + '</div>';
  card.addEventListener('click', () => abrirFichaEquipo(eq.key));
  return card;
}

function renderPendientes(root) {
  const tab = MP.uiState.pendTab || 'operativos';
  const pendientes = MP.pendientes.data || [];
  const incons = MP.inconsistencias.data || [];
  root.innerHTML = '';
  root.appendChild(el('div', { class: 'row-between mb-3' }, [
    el('h1', { text: 'Pendientes' }),
    el('div', { class: 'row' }, [
      el('button', { class: 'btn btn-primary', html: icon('plus',14) + ' Nuevo', onclick: () => abrirModalPendiente(null) }),
      botonRefrescar()
    ])
  ]));

  const operativos = pendientes;
  const inconsActivas = incons.filter((i) => i.estado === 'nueva' && !['equipo_nuevo','cambio_catastro'].includes(i.tipo));
  const informativos = incons.filter((i) => i.estado === 'nueva' && ['equipo_nuevo','cambio_catastro'].includes(i.tipo));

  const tabs = el('div', { class: 'tabs' });
  [['operativos', 'Operativos (' + operativos.length + ')'],['inconsistencias', 'Inconsistencias (' + inconsActivas.length + ')'],['informativos', 'Informativos (' + informativos.length + ')']].forEach((t) => {
    const b = el('button', { class: 'tab' + (tab === t[0] ? ' active' : ''), text: t[1] });
    b.addEventListener('click', () => { MP.uiState.pendTab = t[0]; saveUiState(); renderView('pendientes'); });
    tabs.appendChild(b);
  });
  root.appendChild(tabs);

  if (tab === 'operativos') renderPendientesOperativos(root, operativos);
  else if (tab === 'inconsistencias') renderInconsistencias(root, inconsActivas, false);
  else renderInconsistencias(root, informativos, true);
}

function renderPendientesOperativos(root, lista) {
  const filtros = MP.uiState.pendFiltros || { estado: 'abiertos' };
  const filtroVista = MP.uiState.pendFiltro || '';
  const card = el('div', { class: 'card mb-3' });
  const row = el('div', { class: 'row' }, [
    selectFiltro('Estado', filtros.estado, [
      { value: 'abiertos', label: 'Abiertos' },{ value: 'cerrados', label: 'Cerrados' },{ value: 'todos', label: 'Todos' }
    ], (v) => { filtros.estado = v; MP.uiState.pendFiltros = filtros; renderView('pendientes'); }),
    selectFiltro('Responsable', filtros.responsable, EJECUTORES_DEFAULT, (v) => { filtros.responsable = v; MP.uiState.pendFiltros = filtros; renderView('pendientes'); }),
    selectFiltro('Prioridad', filtros.prioridad, ['alta','media','baja'], (v) => { filtros.prioridad = v; MP.uiState.pendFiltros = filtros; renderView('pendientes'); }),
    selectFiltro('Vista', filtroVista, [{ value: 'vencidos', label: 'Solo vencidos' }], (v) => { MP.uiState.pendFiltro = v; renderView('pendientes'); }),
    el('button', { class: 'btn btn-sm btn-secondary', text: 'Vista: ' + ((MP.uiState.pendCardView !== false) ? 'Tarjetas' : 'Tabla'),
      onclick: () => { MP.uiState.pendCardView = !(MP.uiState.pendCardView !== false); renderView('pendientes'); } }),
    el('button', { class: 'btn btn-sm btn-secondary', html: icon('download',12) + ' Excel',
      onclick: () => exportarPendientesExcel(filter(lista)) })
  ]);
  card.appendChild(row);
  root.appendChild(card);

  function filter(arr) {
    return arr.filter((p) => {
      if (filtros.estado === 'abiertos' && p.estado !== 'abierto') return false;
      if (filtros.estado === 'cerrados' && p.estado !== 'cerrado') return false;
      if (filtros.responsable && p.ejecutor !== filtros.responsable) return false;
      if (filtros.prioridad && p.prioridad !== filtros.prioridad) return false;
      if (filtroVista === 'vencidos') {
        if (!p.fechaCompromiso) return false;
        if (new Date(p.fechaCompromiso) >= new Date(todayISO())) return false;
      }
      return true;
    });
  }
  const filt = filter(lista);
  if (!filt.length) { root.appendChild(emptyState('Sin pendientes', 'No hay pendientes con esos filtros.', 'check-circle')); return; }
  const eqMap = equiposByKey();
  if (MP.uiState.pendCardView !== false) {
    const wrap = el('div', { class: 'grid-3' });
    filt.forEach((p) => wrap.appendChild(pendienteCard(p, eqMap[p.equipoKey])));
    root.appendChild(wrap);
  } else {
    const tw = el('div', { class: 'table-wrap' });
    const t = el('table', { class: 'table table-sortable' });
    t.innerHTML = '<thead><tr><th></th><th>Descripción</th><th>Equipo</th><th>Responsable</th><th>Compromiso</th><th>Prioridad</th><th>Estado</th></tr></thead>';
    const tb = el('tbody');
    filt.forEach((p) => {
      const eq = eqMap[p.equipoKey];
      const vencido = p.fechaCompromiso && p.estado === 'abierto' && new Date(p.fechaCompromiso) < new Date(todayISO());
      const tr = el('tr', { class: 'row-link' });
      tr.innerHTML = '<td>' + estadoPendDot(p) + '</td>' +
        '<td>' + escapeHtml(p.descripcion) + '</td>' +
        '<td>' + (eq ? escapeHtml(eq.equipo + ' (' + eq.inventario + ')') : '<span class="muted">suelto</span>') + '</td>' +
        '<td>' + escapeHtml(p.ejecutor || '—') + '</td>' +
        '<td>' + (p.fechaCompromiso ? fmtFecha(p.fechaCompromiso) + (vencido ? ' <span class="badge badge-danger">vencido</span>' : '') : '—') + '</td>' +
        '<td><span class="badge ' + (p.prioridad === 'alta' ? 'badge-danger' : p.prioridad === 'media' ? 'badge-warning' : 'badge-neutral') + '">' + escapeHtml(p.prioridad || 'media') + '</span></td>' +
        '<td>' + escapeHtml(p.estado) + '</td>';
      tr.addEventListener('click', () => abrirModalPendiente(p));
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); root.appendChild(tw);
  }
}

function estadoPendDot(p) {
  // Indicador de sincronización: si está en cola, naranja
  const enCola = MP.queue.some((q) => q.payload && q.payload.pendiente && q.payload.pendiente.id === p.id);
  if (enCola) return '<span class="dot dot-orange" title="Sincronizando"></span>';
  if (p.estado === 'cerrado') return '<span class="dot dot-green" title="Cerrado"></span>';
  return '<span class="dot dot-blue" title="Abierto"></span>';
}

function pendienteCard(p, eq) {
  const vencido = p.fechaCompromiso && p.estado === 'abierto' && new Date(p.fechaCompromiso) < new Date(todayISO());
  const diasV = vencido ? -daysBetween(p.fechaCompromiso, todayISO()) : 0;
  const c = el('div', { class: 'card card-interactive' });
  c.innerHTML = '<div class="row-between mb-2">' +
    '<div class="row">' + estadoPendDot(p) + ' <strong>' + escapeHtml(p.descripcion) + '</strong></div>' +
    '<span class="badge ' + (p.prioridad === 'alta' ? 'badge-danger' : p.prioridad === 'media' ? 'badge-warning' : 'badge-neutral') + '">' + escapeHtml(p.prioridad || 'media') + '</span>' +
    '</div>' +
    '<div class="tiny muted">' + (eq ? icon('equipment',12) + ' ' + escapeHtml(eq.equipo + ' · ' + eq.inventario) : '<em>Pendiente suelto</em>') + '</div>' +
    '<div class="tiny mt-2">' + icon('user',12) + ' ' + escapeHtml(p.ejecutor || '—') + (p.fechaCompromiso ? ' · ' + icon('calendar',12) + ' ' + fmtFecha(p.fechaCompromiso) : '') +
    (vencido ? ' <span class="badge badge-danger">' + diasV + 'd vencido</span>' : '') + '</div>' +
    ((p.etiquetas && p.etiquetas.length) ? '<div class="row mt-2">' + p.etiquetas.map((t) => '<span class="tag">' + escapeHtml(t) + '</span>').join('') + '</div>' : '') +
    ((p.actualizaciones && p.actualizaciones.length) ? '<div class="tiny muted mt-2">' + icon('file-text',12) + ' ' + p.actualizaciones.length + ' actualización' + (p.actualizaciones.length === 1 ? '' : 'es') + '</div>' : '');
  c.addEventListener('click', () => abrirModalPendiente(p));
  return c;
}

/* ===== Vista VERIFICACIÓN ===== */
function renderVerificacion(root) {
  root.innerHTML = '';
  root.appendChild(el('div', { class: 'row-between mb-3' }, [el('h1', { text: 'Verificación de carga' }), botonRefrescar()]));
  const equipos = MP.equipos.data || [];
  const validos = equipos.filter((e) => !e.isSlot).length;
  const slots = equipos.filter((e) => e.isSlot).length;
  const porFam = {};
  equipos.forEach((eq) => { if (!eq.isSlot) porFam[eq.familiaCalc] = (porFam[eq.familiaCalc] || 0) + 1; });

  const grid = el('div', { class: 'kpi-grid mb-4' });
  grid.appendChild(kpiSmall('Filas PMP', equipos.length, 'file-text', null));
  grid.appendChild(kpiSmall('Equipos válidos', validos, 'check-circle', () => { MP.uiState.filtros = {}; navigate('buscar'); }));
  grid.appendChild(kpiSmall('Slots vacíos', slots, 'archive', null));
  grid.appendChild(kpiSmall('Familias', Object.keys(porFam).length, 'tag', null));
  root.appendChild(grid);

  // Familias
  const cf = el('div', { class: 'card mb-3' });
  cf.appendChild(el('h3', { text: 'Por familia' }));
  const fr = el('div', { class: 'row' });
  Object.keys(porFam).sort().forEach((f) => {
    const b = el('button', { class: 'btn btn-secondary' }, [
      el('span', { text: f + ': ' }), el('strong', { text: porFam[f] })
    ]);
    b.addEventListener('click', () => { MP.uiState.filtros = { familia: f }; navigate('buscar'); });
    fr.appendChild(b);
  });
  cf.appendChild(fr);
  root.appendChild(cf);

  // Códigos por mes (PMP y Registro)
  const allCodPmp = new Set(); const allCodReg = new Set();
  const cntPmp = []; const cntReg = [];
  for (let m = 0; m < 12; m++) { cntPmp.push({}); cntReg.push({}); }
  equipos.forEach((eq) => {
    if (eq.isSlot) return;
    for (let m = 0; m < 12; m++) {
      const p = eq.mesesP[m]; if (p) { cntPmp[m][p] = (cntPmp[m][p] || 0) + 1; allCodPmp.add(p); }
      const r = (eq.mesesReg[m] || {}).r; if (r) { cntReg[m][r] = (cntReg[m][r] || 0) + 1; allCodReg.add(r); }
    }
  });
  root.appendChild(tablaCodigos('PMP — códigos por mes', Array.from(allCodPmp), cntPmp, false));
  root.appendChild(tablaCodigos('Registro — resultados por mes', Array.from(allCodReg), cntReg, true));

  // Duplicados de inventario
  const seen = {}; const dups = [];
  equipos.forEach((eq) => { if (!eq.inventario) return; if (seen[eq.inventario]) dups.push({ inv: eq.inventario, ids: [seen[eq.inventario], eq.id] }); else seen[eq.inventario] = eq.id; });
  const dc = el('div', { class: 'card mt-3' });
  dc.innerHTML = '<h3>Duplicados de inventario (' + dups.length + ')</h3>';
  if (dups.length) {
    const ul = el('ul'); dups.forEach((d) => ul.appendChild(el('li', { text: d.inv + ' → ' + d.ids.join(' / ') }))); dc.appendChild(ul);
  } else dc.appendChild(el('div', { class: 'muted tiny', text: 'Ninguno.' }));
  root.appendChild(dc);
}

function tablaCodigos(titulo, cods, counts, isReg) {
  const card = el('div', { class: 'card mb-3' });
  card.appendChild(el('h3', { text: titulo }));
  if (!cods.length) { card.appendChild(el('div', { class: 'muted tiny', text: 'Sin datos.' })); return card; }
  const tw = el('div', { class: 'table-wrap' });
  const t = el('table', { class: 'table table-dense' });
  let h = '<thead><tr><th>Cód</th>';
  for (let m = 0; m < 12; m++) h += '<th>' + MESES[m] + '</th>';
  h += '<th>Total</th></tr></thead>';
  t.innerHTML = h;
  const tb = el('tbody');
  cods.sort().forEach((c) => {
    let row = '<tr class="row-link" data-cod="' + escapeHtml(c) + '"><td>' + codigoBadge(c) + '</td>';
    let total = 0;
    for (let m = 0; m < 12; m++) { const n = counts[m][c] || 0; total += n; row += '<td>' + (n || '—') + '</td>'; }
    row += '<td><strong>' + total + '</strong></td></tr>';
    tb.innerHTML += row;
  });
  t.appendChild(tb); tw.appendChild(t); card.appendChild(tw);
  tw.querySelectorAll('tr.row-link').forEach((tr) => tr.addEventListener('click', () => {
    const c = tr.dataset.cod;
    if (isReg) { MP.uiState.filtros = { resultado: c }; }
    else { MP.uiState.filtros = {}; }
    navigate('buscar');
  }));
  return card;
}

function configField(label, key, value, opts) {

  row.appendChild(inp);
  if (opts.password) {
    const tog = el('button', { class: 'btn btn-icon btn-ghost', html: icon('eye',14) });
    tog.addEventListener('click', () => { inp.type = inp.type === 'password' ? 'text' : 'password'; tog.innerHTML = icon(inp.type === 'password' ? 'eye' : 'eye-off', 14); });
    row.appendChild(tog);

      const tr = el('tr');
      tr.innerHTML = '<td>' + escapeHtml(q.action) + '</td>' +
        '<td><span class="badge ' + (q.estado === 'conflicto' ? 'badge-danger' : 'badge-warning') + '">' + q.estado + '</span></td>' +
        '<td>' + q.intentos + '</td>' +
        '<td class="tiny muted">' + escapeHtml(q.ultimoError || '—') + '</td>' +
        '<td><button class="btn btn-sm btn-ghost" data-act="retry">Reintentar</button> <button class="btn btn-sm btn-ghost" data-act="del">Descartar</button></td>';
      tr.querySelector('[data-act="retry"]').addEventListener('click', () => { q.intentos = 0; q.estado = 'pendiente'; q.ultimoError = ''; lsSet(LS.queue, MP.queue); Queue.process(); });
      tr.querySelector('[data-act="del"]').addEventListener('click', () => { Queue.remove(q.id); root.remove(); abrirModalCola(); });
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); body.appendChild(tw);
  }
  root.appendChild(body);
  root.appendChild(el('div', { class: 'modal-footer' }, [el('button', { class: 'btn btn-primary', text: 'Cerrar', dataset: { close: '1' } })]));
  openModal(root, { size: 'lg' });
}

/* ===== Ficha del equipo ===== */
function abrirFichaEquipo(key) {
  const eqMap = equiposByKey();
  const eq = eqMap[key];
  if (!eq) { Toast.danger('Equipo no encontrado'); return; }
  MP.uiState.modalAbierto = { tipo: 'ficha', key };
  saveUiState();
  const root = el('div');
  root.innerHTML = '<div class="modal-header"><h3 class="modal-title">' + escapeHtml(eq.equipo) + ' <span class="badge badge-info">' + escapeHtml(eq.familiaCalc) + '</span></h3><button class="btn btn-icon btn-ghost" data-close id="fichaClose">' + icon('x') + '</button></div>';
  const body = el('div', { class: 'modal-body' });

  // Datos del catastro
  const dat = el('div', { class: 'card mb-3' });
  dat.innerHTML = '<h3>Catastro</h3>' +
    '<div class="grid-3 tiny">' +
    '<div><span class="muted">ID</span><br><strong>' + escapeHtml(eq.id) + '</strong></div>' +
    '<div><span class="muted">N° Inventario</span><br><strong>' + escapeHtml(eq.inventario) + '</strong></div>' +
    '<div><span class="muted">N° Carpeta</span><br><strong>' + escapeHtml(eq.carpeta) + '</strong></div>' +
    '<div><span class="muted">Servicio</span><br><strong>' + escapeHtml(eq.servicio) + '</strong></div>' +
    '<div><span class="muted">Ubicación</span><br><strong>' + escapeHtml(eq.ubicacion) + '</strong></div>' +
    '<div><span class="muted">Marca/Modelo</span><br><strong>' + escapeHtml(eq.marca + ' ' + eq.modelo) + '</strong></div>' +
    '<div><span class="muted">Serie</span><br><strong>' + escapeHtml(eq.serie) + '</strong></div>' +
    '<div><span class="muted">Año / Vida útil</span><br><strong>' + escapeHtml(eq.anio + ' / ' + eq.vidaUtil) + '</strong></div>' +
    '<div><span class="muted">Frecuencia</span><br><strong>' + escapeHtml(eq.frecuencia) + '</strong></div>' +
    '</div>';
  body.appendChild(dat);

  // Calendario mensual
  const cal = el('div', { class: 'card mb-3' });
  cal.innerHTML = '<h3>Programación 2026</h3>';
  const mg = el('div', { class: 'month-grid' });
  const overrides = (MP.overrides.data || {})[eq.key] || {};
  const asign = (MP.asignaciones.data || {})[eq.key] || {};
  for (let m = 0; m < 12; m++) {
    const p = eq.mesesP[m];
    const reg = eq.mesesReg[m] || {};
    const ov = overrides[m];
    const r = ov || reg.r;
    const cell = el('div', { class: 'month-cell' });
    cell.innerHTML = '<div class="m-name">' + MESES[m] + '</div>' +
      (p ? codigoBadge(p) : '<span class="tiny muted">—</span>') +
      (r ? '<div class="tiny">' + codigoBadge(r) + '</div>' : '') +
      (asign[m] ? '<div class="tiny muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">' + escapeHtml(asign[m].split(' ')[0]) + '</div>' : '');
    cell.addEventListener('click', () => abrirModalMesEquipo(eq, m));
    mg.appendChild(cell);
  }
  cal.appendChild(mg);
  body.appendChild(cal);

  // Eventos
  const evs = (eventosByKey()[eq.key] || []).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const evCard = el('div', { class: 'card mb-3' });
  evCard.innerHTML = '<div class="row-between"><h3>Eventos (' + evs.length + ')</h3></div>';
  evCard.appendChild(el('button', { class: 'btn btn-sm btn-primary mb-2', html: icon('plus',12) + ' Nuevo evento', onclick: () => abrirModalEvento(eq, null) }));
  if (evs.length) {
    const ul = el('div', { class: 'stack' });
    evs.slice(0, 10).forEach((ev) => {
      const c = el('div', { class: 'card', style: 'padding:8px 12px' });
      c.innerHTML = '<div class="row-between"><strong>' + escapeHtml(ev.tipo) + '</strong><span class="tiny muted">' + fmtFecha(ev.fecha) + '</span></div>' +
        '<div class="tiny">' + (ev.resultado ? codigoBadge(ev.resultado) + ' ' : '') + escapeHtml(ev.ejecutor || '') + (ev.observacion ? ' · ' + escapeHtml(ev.observacion) : '') + '</div>';
      c.addEventListener('click', () => abrirModalEvento(eq, ev));
      ul.appendChild(c);
    });
    evCard.appendChild(ul);
  } else evCard.appendChild(el('div', { class: 'tiny muted', text: 'Sin eventos registrados.' }));
  body.appendChild(evCard);

  // Pendientes
  const peqs = (pendientesByKey()[eq.key] || []);
  const pc = el('div', { class: 'card mb-3' });
  pc.innerHTML = '<h3>Pendientes (' + peqs.length + ')</h3>';
  pc.appendChild(el('button', { class: 'btn btn-sm btn-primary mb-2', html: icon('plus',12) + ' Nuevo pendiente', onclick: () => abrirModalPendiente({ equipoKey: eq.key }) }));
  if (peqs.length) {
    const ul = el('div', { class: 'stack' });
    peqs.forEach((p) => {
      const it = el('div', { class: 'card', style: 'padding:8px 12px' });
      it.innerHTML = '<div class="row-between"><strong>' + escapeHtml(p.descripcion) + '</strong><span class="badge ' + (p.estado === 'cerrado' ? 'badge-success' : 'badge-warning') + '">' + p.estado + '</span></div>' +
        '<div class="tiny muted">' + escapeHtml(p.ejecutor || '—') + (p.fechaCompromiso ? ' · ' + fmtFecha(p.fechaCompromiso) : '') + '</div>';
      it.addEventListener('click', () => abrirModalPendiente(p));
      ul.appendChild(it);
    });
    pc.appendChild(ul);
  } else pc.appendChild(el('div', { class: 'tiny muted', text: 'Sin pendientes.' }));
  body.appendChild(pc);

  // Reprogramaciones
  const rps = (reprogsByKey()[eq.key] || []);
  const rc = el('div', { class: 'card mb-3' });
  rc.innerHTML = '<h3>Reprogramaciones (' + rps.length + ')</h3>';
  rc.appendChild(el('button', { class: 'btn btn-sm btn-primary mb-2', html: icon('plus',12) + ' Nueva reprogramación', onclick: () => abrirModalReprog(eq, null) }));
  if (rps.length) {
    const ul = el('div', { class: 'stack' });
    rps.forEach((r) => {
      const it = el('div', { class: 'card', style: 'padding:8px 12px' });
      it.innerHTML = '<div class="row-between">' + codigoBadge(r.causal) + ' <span class="tiny muted">' + fmtFecha(r.fechaRegistro) + '</span></div>' +
        '<div class="tiny">Origen: ' + (MESES[r.mesOrigen - 1] || '?') + ' → Destino: ' + (r.mesDestino ? MESES[r.mesDestino - 1] : 'Sin definir') + '</div>' +
        (r.comentario ? '<div class="tiny muted">' + escapeHtml(r.comentario) + '</div>' : '');
      ul.appendChild(it);
    });
    rc.appendChild(ul);
  }
  body.appendChild(rc);

  root.appendChild(body);
  const ft = el('div', { class: 'modal-footer' });
  ft.appendChild(el('button', { class: 'btn btn-secondary', html: icon('printer',12) + ' Imprimir', onclick: () => window.print() }));
  ft.appendChild(el('button', { class: 'btn btn-primary', text: 'Cerrar', dataset: { close: '1' } }));
  root.appendChild(ft);

  const m = openModal(root, { size: 'lg' });
  const oldClose = m.close;
  m.close = () => { MP.uiState.modalAbierto = null; saveUiState(); oldClose(); };
  m.backdrop.addEventListener('click', (e) => { if (e.target === m.backdrop) m.close(); });
  $$('[data-close]', m.modal).forEach((b) => b.addEventListener('click', m.close));
}

function abrirModalMesEquipo(eq, m) {
  const reg = eq.mesesReg[m] || {};
  const ov = ((MP.overrides.data || {})[eq.key] || {})[m] || '';
  const asign = ((MP.asignaciones.data || {})[eq.key] || {})[m] || '';
  const root = el('div');
  root.innerHTML = '<div class="modal-header"><h3 class="modal-title">' + escapeHtml(eq.equipo) + ' — ' + MESES_LARGO[m] + '</h3><button class="btn btn-icon btn-ghost" data-close>' + icon('x') + '</button></div>';
  const body = el('div', { class: 'modal-body' });
  body.innerHTML = '<div class="tiny mb-3">Programación PMP: ' + codigoBadge(eq.mesesP[m]) + (reg.r ? ' · Resultado actual: ' + codigoBadge(reg.r) : '') + '</div>';
  const fOv = el('label', { class: 'field' }, [
    el('span', { class: 'lbl', text: 'Override de resultado (no toca la hoja Registro)' }),
    (() => { const s = el('select', { class: 'select' });
      s.appendChild(el('option', { value: '', text: '— sin override —' }));
      CODIGOS_REG.forEach((c) => { const o = el('option', { value: c, text: c }); if (ov === c) o.selected = true; s.appendChild(o); });
      s.id = 'ovSel'; return s; })()
  ]);
  body.appendChild(fOv);
  const fAs = el('label', { class: 'field' }, [
    el('span', { class: 'lbl', text: 'Responsable asignado' }),
    (() => { const s = el('select', { class: 'select' });
      s.appendChild(el('option', { value: '', text: '— sin asignar —' }));
      EJECUTORES_DEFAULT.forEach((e) => { const o = el('option', { value: e, text: e }); if (asign === e) o.selected = true; s.appendChild(o); });
      s.id = 'asSel'; return s; })()
  ]);
  body.appendChild(fAs);

  body.appendChild(el('h3', { class: 'mt-3', text: 'Reprogramación' }));
  body.appendChild(el('button', { class: 'btn btn-sm btn-primary', html: icon('plus',12) + ' Crear reprogramación desde este mes', onclick: () => abrirModalReprog(eq, { mesOrigen: m + 1 }) }));

  root.appendChild(body);
  const ft = el('div', { class: 'modal-footer' });
  ft.appendChild(el('button', { class: 'btn btn-ghost', text: 'Cancelar', dataset: { close: '1' } }));
  ft.appendChild(el('button', { class: 'btn btn-primary', text: 'Guardar', onclick: () => {
    const ovV = $('#ovSel').value;
    const asV = $('#asSel').value;
    // Validaciones
    if (ovV === 'Si' && eq.mesesReg.some((r) => r.r === 'Baja')) {
      Toast.warning('Equipo con Baja previa: confirma antes de marcar Si');
    }
    // Override
    if (ovV) Queue.add('saveResultadoOverride', { equipoKey: eq.key, mes: m + 1, resultado: ovV });
    else if (ov) Queue.add('deleteResultadoOverride', { equipoKey: eq.key, mes: m + 1 });
    if (!MP.overrides.data[eq.key]) MP.overrides.data[eq.key] = {};
    if (ovV) MP.overrides.data[eq.key][m] = ovV; else delete MP.overrides.data[eq.key][m];
    saveCache(LS.cacheOver, MP.overrides);
    // Asignación
    if (asV !== asign) {
      Queue.add('saveAsignacion', { equipoKey: eq.key, mes: m + 1, ejecutor: asV });
      if (!MP.asignaciones.data[eq.key]) MP.asignaciones.data[eq.key] = {};
      if (asV) MP.asignaciones.data[eq.key][m] = asV; else delete MP.asignaciones.data[eq.key][m];
      saveCache(LS.cacheAsign, MP.asignaciones);
    }
    calcularKPIsLocal();
    Toast.success('Guardado localmente. Sincronizando…');
    document.querySelectorAll('.modal-backdrop').forEach((b, i, all) => { if (i === all.length - 1) b.remove(); });
    abrirFichaEquipo(eq.key);
  } }));
  root.appendChild(ft);
  openModal(root);
}

/* ===== Modal Pendiente ===== */
function abrirModalPendiente(p) {
  const isNew = !p || !p.id;
  p = p || { descripcion: '', ejecutor: '', prioridad: 'media', estado: 'abierto', tareas: [], actualizaciones: [], etiquetas: [] };
  const draftKey = 'pendiente_' + (p.id || 'new');
  const draft = MP.drafts[draftKey];
  if (draft && isNew) {
    // ofrecer recuperar luego
  }
  const root = el('div');
  root.innerHTML = '<div class="modal-header"><h3 class="modal-title">' + (isNew ? 'Nuevo pendiente' : 'Editar pendiente') + '</h3><button class="btn btn-icon btn-ghost" data-close>' + icon('x') + '</button></div>';
  const body = el('div', { class: 'modal-body' });

  if (draft && draft.formData) {
    const banner = el('div', { class: 'card mb-3', style: 'background:#fef3c7;border-color:#fbbf24' });
    banner.innerHTML = '<div class="row-between"><span class="tiny">Borrador sin guardar de hace ' + Math.round((Date.now() - draft.ts) / 60000) + ' min</span></div>';
    banner.appendChild(el('div', { class: 'row mt-2' }, [
      el('button', { class: 'btn btn-sm btn-primary', text: 'Recuperar', onclick: () => { Object.assign(p, draft.formData); banner.remove(); pintar(); } }),
      el('button', { class: 'btn btn-sm btn-ghost', text: 'Descartar', onclick: () => { delete MP.drafts[draftKey]; lsSet(LS.drafts, MP.drafts); banner.remove(); } })
    ]));
    body.appendChild(banner);
  }

  const form = el('div'); body.appendChild(form);
  function pintar() {
    form.innerHTML = '';
    form.appendChild(fieldText('Descripción', 'descripcion', p.descripcion, { textarea: true }));
    form.appendChild(fieldSelect('Equipo asociado (opcional)', 'equipoKey', p.equipoKey, [{ value: '', label: '— Pendiente suelto —' }].concat((MP.equipos.data || []).filter((e) => !e.isSlot).map((e) => ({ value: e.key, label: e.equipo + ' · ' + e.inventario })))));
    const row = el('div', { class: 'field-row' });
    row.appendChild(fieldSelect('Responsable', 'ejecutor', p.ejecutor, [''].concat(EJECUTORES_DEFAULT).map((e) => ({ value: e, label: e || '— sin asignar —' }))));
    row.appendChild(fieldSelect('Prioridad', 'prioridad', p.prioridad, [['alta','Alta'],['media','Media'],['baja','Baja']].map(([v,l]) => ({ value: v, label: l }))));
    row.appendChild(fieldText('Fecha compromiso', 'fechaCompromiso', p.fechaCompromiso, { type: 'date' }));
    form.appendChild(row);
    form.appendChild(fieldText('Etiquetas (separadas por coma)', '_etiquetasStr', (p.etiquetas || []).join(', ')));
    // Tareas (checklist)
    const tcard = el('div', { class: 'card mb-3' });
    tcard.innerHTML = '<h3>Checklist</h3>';
    (p.tareas || []).forEach((t, i) => {
      const r = el('div', { class: 'row mb-2' });
      const cb = el('input', { type: 'checkbox' }); cb.checked = t.done;
      cb.addEventListener('change', () => { p.tareas[i].done = cb.checked; saveDraft(); });
      const txt = el('input', { class: 'input', value: t.texto });
      txt.addEventListener('input', () => { p.tareas[i].texto = txt.value; saveDraft(); });
      const x = el('button', { class: 'btn btn-icon btn-ghost', html: icon('x',12) });
      x.addEventListener('click', () => { p.tareas.splice(i, 1); pintar(); });
      r.appendChild(cb); r.appendChild(txt); r.appendChild(x);
      tcard.appendChild(r);
    });
    tcard.appendChild(el('button', { class: 'btn btn-sm btn-secondary', html: icon('plus',12) + ' Agregar tarea', onclick: () => { p.tareas = p.tareas || []; p.tareas.push({ texto: '', done: false }); pintar(); } }));
    form.appendChild(tcard);
    // Actualizaciones (siempre visible: para agregar comentarios al historial)
    const ac = el('div', { class: 'card' });
    ac.innerHTML = '<h3>Actualizaciones</h3>' +
      '<p class="tiny muted" style="margin:0 0 8px">Registra avances, llamadas, gestiones realizadas. Quedan en el historial del pendiente.</p>';
    const acList = el('div', { class: 'stack' });
    function pintarUpdates() {
      acList.innerHTML = '';
      if (!p.actualizaciones || !p.actualizaciones.length) {
        acList.appendChild(el('div', { class: 'tiny muted', text: 'Sin actualizaciones aún.' }));
        return;
      }
      const ordered = (p.actualizaciones || []).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
      ordered.forEach((a) => {
        const it = el('div', { class: 'card', style: 'padding:8px 12px;background:var(--c-bg-soft);border:none' });
        const head = el('div', { class: 'row-between mb-2' }, [
          el('div', { class: 'tiny' }, [el('strong', { text: fmtDateTime(a.fecha) }), el('span', { class: 'muted', text: a.usuario ? ' · ' + a.usuario : '' })]),
          el('button', { class: 'btn btn-sm btn-ghost', html: icon('trash',12), onclick: () => {
            p.actualizaciones = (p.actualizaciones || []).filter((x) => x.id !== a.id);
            saveDraft(); pintarUpdates();
          } })
        ]);
        it.appendChild(head);
        it.appendChild(el('div', { class: 'tiny', text: a.texto }));
        acList.appendChild(it);
      });
    }
    ac.appendChild(acList);

    const addRow = el('div', { class: 'row mt-3' });
    const ta = el('textarea', { class: 'textarea', placeholder: 'Nueva actualización (Ctrl+Enter para guardar)', style: 'flex:1;min-height:60px' });
    const btnAdd = el('button', { class: 'btn btn-primary', html: icon('plus',12) + ' Agregar', onclick: () => {
      const txt = ta.value.trim();
      if (!txt) { Toast.warning('Escribe el comentario antes de agregar'); return; }
      p.actualizaciones = p.actualizaciones || [];
      p.actualizaciones.push({ id: uid(), fecha: new Date().toISOString(), texto: txt, usuario: '' });
      ta.value = '';
      saveDraft();
      pintarUpdates();
    } });
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); btnAdd.click(); } });
    addRow.appendChild(ta); addRow.appendChild(btnAdd);
    ac.appendChild(addRow);

    pintarUpdates();
    form.appendChild(ac);
    // bind inputs
    form.querySelectorAll('[data-key]').forEach((inp) => {
      inp.addEventListener('input', () => {
        const k = inp.dataset.key;
        p[k] = inp.value;
        saveDraft();
      });
    });
  }
  function saveDraft() {
    MP.drafts[draftKey] = { ts: Date.now(), formData: JSON.parse(JSON.stringify(p)) };
    lsSet(LS.drafts, MP.drafts);
  }
  pintar();

  root.appendChild(body);
  const ft = el('div', { class: 'modal-footer' });
  if (!isNew) {
    ft.appendChild(el('button', { class: 'btn btn-danger', html: icon('trash',12) + ' Eliminar', onclick: () => {
      Toast.show('Eliminando pendiente…', { action: 'Deshacer', duration: 8000,
        onConfirm: () => { Queue.add('deletePendiente', { id: p.id }); MP.pendientes.data = MP.pendientes.data.filter((x) => x.id !== p.id); saveCache(LS.cachePend, MP.pendientes); },
        onAction: () => Toast.show('Eliminación cancelada') });
      document.querySelectorAll('.modal-backdrop').forEach((b, i, all) => { if (i === all.length - 1) b.remove(); });
      renderView(currentView);
    } }));
    ft.appendChild(el('button', { class: 'btn btn-secondary', text: p.estado === 'cerrado' ? 'Reabrir' : 'Cerrar', onclick: () => {
      p.estado = p.estado === 'cerrado' ? 'abierto' : 'cerrado';
      Queue.add('togglePendiente', { id: p.id });
      const idx = MP.pendientes.data.findIndex((x) => x.id === p.id);
      if (idx >= 0) MP.pendientes.data[idx].estado = p.estado;
      saveCache(LS.cachePend, MP.pendientes);
      document.querySelectorAll('.modal-backdrop').forEach((b, i, all) => { if (i === all.length - 1) b.remove(); });
      renderView(currentView);
    } }));
  }
  ft.appendChild(el('button', { class: 'btn btn-ghost', text: 'Cancelar', dataset: { close: '1' } }));
  ft.appendChild(el('button', { class: 'btn btn-primary', text: 'Guardar', onclick: () => {
    // Validaciones
    if (!p.descripcion || !p.descripcion.trim()) { Toast.danger('La descripción es obligatoria'); return; }
    p.etiquetas = (form.querySelector('[data-key="_etiquetasStr"]') ? form.querySelector('[data-key="_etiquetasStr"]').value : '').split(',').map((s) => s.trim()).filter(Boolean);
    delete p._etiquetasStr;
    if (isNew) p.id = uid();
    if (!p.fechaCreacion) p.fechaCreacion = todayISO();
    const idx = MP.pendientes.data.findIndex((x) => x.id === p.id);
    if (idx >= 0) MP.pendientes.data[idx] = p; else MP.pendientes.data.push(p);
    saveCache(LS.cachePend, MP.pendientes);
    Queue.add('savePendiente', { pendiente: p }, { localId: p.id });
    delete MP.drafts[draftKey]; lsSet(LS.drafts, MP.drafts);
    Toast.success('Guardado localmente. Sincronizando…');
